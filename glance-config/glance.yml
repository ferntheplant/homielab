server:
  assets-path: /app/config/assets
theme:
  # Rose Pine Moon (base, iris, foam, love)
  light: false
  background-color: 246 24 17
  contrast-multiplier: 1.2
  primary-color: 267 57 78
  positive-color: 189 43 73
  negative-color: 343 76 68
  presets:
    default-dark:
      # Rose Pine Moon
      light: false
      background-color: 246 24 17
      contrast-multiplier: 1.2
      primary-color: 267 57 78
      positive-color: 189 43 73
      negative-color: 343 76 68
    default-light:
      # Rose Pine Dawn
      light: true
      background-color: 32 57 95
      contrast-multiplier: 1.0
      primary-color: 268 21 57
      positive-color: 189 30 48
      negative-color: 343 35 55
pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: full
        widgets:
          - $include: widget-config/gcal.yml

          - $include: widget-config/weather.yml

          - type: custom-api
            height: 300px
            title: Random Dog
            cache: 2m
            url: https://dog.ceo/api/breeds/image/random
            template: |
              <img src="{{ .JSON.String "message" }}"></img>

      - size: full
        widgets:
          - $include: widget-config/quick-links.yml

          - $include: widget-config/karakeep.yml

          - type: group
            title: Availability
            widgets:
              - type: monitor
                cache: 1m
                title: Services
                sites:
                  - title: karakeep
                    url: https://${TS_HOST}:3003
                    check-url: http://karakeep-web:3000/api/health
                    icon: sh:karakeep
                  - title: backrest
                    url: https://${TS_HOST}/backrest/
                    check-url: http://backrest:9898
                    icon: sh:backrest
                  - title: syncthing
                    url: https://${TS_HOST}/syncthing/
                    check-url: http://syncthing:8384/rest/noauth/health
                    icon: sh:syncthing
                  - title: beszel
                    url: https://${TS_HOST}/beszel
                    check-url: http://beszel:8090/api/health
                    icon: sh:beszel
                  - title: dozzle
                    url: https://${TS_HOST}/logs
                    check-url: http://dozzle:8080/logs/healthcheck
                    icon: sh:dozzle
              - $include: widget-config/docker.yml
              - $include: widget-config/launchctl-agents.yml
              - type: monitor
                cache: 1m
                title: Websites
                sites:
                  - title: fjorn.dev
                    url: https://fjorn.dev
                    icon: https://fjorn.dev/favicon.svg

      - size: small
        widgets:
          - $include: widget-config/syncthing.yml

          - type: extension
            title: Backups
            url: http://restic-glance-extension:8675/backups
            cache: 1s
            allow-potentially-dangerous-html: true

          - $include: widget-config/beszel.yml
