server:
  assets-path: /app/config/assets
theme:
  # Rose Pine Moon (base, iris, foam, love)
  light: false
  background-color: 246 24 17
  contrast-multiplier: 1.2
  primary-color: 267 57 78
  positive-color: 189 43 73
  negative-color: 343 76 68
  presets:
    default-dark:
      # Rose Pine Moon
      light: false
      background-color: 246 24 17
      contrast-multiplier: 1.2
      primary-color: 267 57 78
      positive-color: 189 43 73
      negative-color: 343 76 68
    default-light:
      # Rose Pine Dawn
      light: true
      background-color: 32 57 95
      contrast-multiplier: 1.0
      primary-color: 268 21 57
      positive-color: 189 30 48
      negative-color: 343 35 55
pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: full
        widgets:
          - $include: widget-config/weather.yml

          - $include: widget-config/syncthing.yml

          - type: extension
            title: Backups
            url: http://restic-glance-extension:8675/backups
            cache: 1s
            allow-potentially-dangerous-html: true

          - type: custom-api
            height: 300px
            title: Random Dog
            cache: 2m
            url: https://dog.ceo/api/breeds/image/random
            template: |
              <img src="{{ .JSON.String "message" }}"></img>

          # https://github.com/glanceapp/community-widgets/blob/main/widgets/xkcd-widget/README.md
          - type: custom-api
            title: xkcd
            title-url: https://xkcd.com
            cache: 2m
            url: https://xkcd.com/info.0.json
            template: |
              <p class="color-highlight">{{ .JSON.String "title" }}</p>
              <img src="{{ .JSON.String "img" }}" alt="{{ .JSON.String "alt" }}" title="{{ .JSON.String "alt" }}" class="margin-top-5"></img>

      - size: full
        widgets:
          - type: group
            title: News
            widgets:
              - type: hacker-news
                limit: 15
                collapse-after: 5
              - type: lobsters
                sort-by: hot
                limit: 15
                collapse-after: 5

          - type: group
            title: Availability
            widgets:
              - $include: widget-config/docker.yml
              - $include: widget-config/launchctl-agents.yml
              - type: monitor
                cache: 1m
                title: Websites
                sites:
                  - title: fjorn.dev
                    url: https://fjorn.dev
                    icon: https://fjorn.dev/favicon.svg

      - size: small
        widgets:
          - type: monitor
            cache: 1m
            title: Services
            sites:
              - title: karakeep
                url: https://karakeep.${TS_TAILNET}
                check-url: http://karakeep-web:3000/api/health
                icon: sh:karakeep
              - title: forgejo
                url: https://forgejo.${TS_TAILNET}
                # Through forgejo-ci on forgejo_glance (stacks/forgejo/docker-compose.yml)
                check-url: http://forgejo-ci/api/healthz
                icon: sh:forgejo
              - title: backrest
                url: https://backrest.${TS_TAILNET}
                check-url: http://backrest:9898
                icon: sh:backrest
              - title: syncthing
                url: https://syncthing.${TS_TAILNET}
                check-url: http://syncthing:8384/rest/noauth/health
                icon: sh:syncthing
              - title: beszel
                url: https://beszel.${TS_TAILNET}
                check-url: http://beszel:8090/api/health
                icon: sh:beszel
              - title: dozzle
                url: https://logs.${TS_TAILNET}
                check-url: http://dozzle:8080/healthcheck
                icon: sh:dozzle
              - title: kata
                url: https://kata.${TS_TAILNET}
                # Through kata-gate on kata_glance (stacks/kata/Caddyfile), the health check only
                check-url: http://kata-gate:8080/api/v1/health
                icon: mdi:checkbox-marked-outline

          - $include: widget-config/beszel.yml

          - $include: widget-config/forgejo.yml
