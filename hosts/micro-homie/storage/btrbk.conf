# btrbk config for the 8 TB storage drive on micro-homie. Installed to /etc/btrbk/btrbk.conf
# by scripts/setup-storage.sh. The Debian btrbk.timer runs `btrbk run` once a day.
#
# Read-only snapshots go to /srv/storage/.snapshots/<subvolume>.<timestamp>.
# They protect against deletes: Syncthing passes a delete on another device to this one.
# `backup` (the restic repo) has no snapshots: restic keeps its own history, and snapshots
# would keep the packs that `restic prune` deletes.

timestamp_format        long
snapshot_preserve_min   2d
snapshot_preserve       14d 8w 6m
snapshot_dir            .snapshots

volume /srv/storage
  subvolume archive
  subvolume sync
