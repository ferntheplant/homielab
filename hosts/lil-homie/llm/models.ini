# llama-server router presets (--models-preset). One section = one model, keys = llama-server
# flags without the leading dashes. The router starts one child process per model on first use,
# so Qwen is in memory once, shared by chat, Karakeep and the AnyJev decisions.
#
# `alias` keeps the old Ollama model names working, so Karakeep's INFERENCE_TEXT_MODEL /
# EMBEDDING_TEXT_MODEL values in 1Password do not need to change.

[qwen3.5-4b]
# bartowski/Qwen_Qwen3.5-4B-GGUF (llama.cpp b9222, imatrix), from Qwen/Qwen3.5-4B. Unchanged weights.
model = /Users/fjorn/models/Qwen_Qwen3.5-4B-Q4_K_M.gguf
mmproj = /Users/fjorn/models/mmproj-Qwen_Qwen3.5-4B-f16.gguf
alias = qwen3.5:4b-16k,qwen3.5:4b
load-on-startup = true
n-gpu-layers = 99
# 2 slots of 16384 tokens each (ctx-size is split between the slots). 16384 = Karakeep's
# INFERENCE_CONTEXT_LENGTH, the num_ctx Ollama used. Karakeep's 4 workers queue for the 2 slots.
ctx-size = 32768
parallel = 2
# Host-RAM prompt cache. The default is 8192 MiB, and one Qwen3.5 entry (recurrent state) is
# ~100 MiB; decisions never reuse it. Keep it small on a 16 GB machine.
cache-ram = 1024
jinja = true
# Thinking off by default (Karakeep, the classifier and AnyJev all need it off).
# A chat request can still turn it on with "chat_template_kwargs": {"enable_thinking": true}.
reasoning = off
# Same sampling defaults Ollama used for qwen3.5 (a request can override them)
temp = 1.0
top-k = 20
top-p = 0.95
min-p = 0
presence-penalty = 1.5

[nomic-embed-text-v2-moe]
# APFS clone of Ollama's blob sha256-a5db3381... (cp -c), so removing Ollama does not remove it
model = /Users/fjorn/models/nomic-embed-text-v2-moe.gguf
alias = nomic-embed-text-v2-moe:latest
load-on-startup = true
n-gpu-layers = 99
embeddings = true
# The model's own limit is 512 tokens; Ollama ran it at 512 too
ctx-size = 512
batch-size = 512
ubatch-size = 512
