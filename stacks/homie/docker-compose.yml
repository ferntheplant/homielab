services:
  # Read-only Docker API for dozzle and glance: lists containers, events, info and logs.
  # Anything that writes (POST/DELETE, exec, start/stop) is denied.
  socket-proxy:
    container_name: socket-proxy
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - socket_proxy

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
    depends_on:
      - socket-proxy
    ports:
      - 127.0.0.1:8082:8080
    networks:
      - caddy_network
      - socket_proxy

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=https://beszel.${TS_TAILNET}
    ports:
      - 127.0.0.1:8090:8090
    volumes:
      - ${DATA_PATH}/beszel_data:/beszel_data
    networks:
      - caddy_network

  # Host agent for this machine. It connects to the hub over WebSocket (HUB_URL + TOKEN).
  # KEY (the hub public key) and TOKEN (from "Add system" in the hub) live in the env file.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ${HOME}/.config/beszel/beszel-agent.env
        required: false
    environment:
      - HUB_URL=http://127.0.0.1:8090
      - LISTEN=127.0.0.1:45876
    volumes:
      # Container stats. The agent only reads, but the Docker API cannot enforce that.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  glance:
    container_name: glance
    # Local build adds tzdata on top of glanceapp/glance; `manage.sh update` rebuilds it with --pull
    build:
      context: ../..
      dockerfile: glance.Dockerfile
    image: fjorn-glance:latest
    restart: unless-stopped
    # Referenced as ${VAR} in glance-config/
    environment:
      - AQI_TOKEN=${AQI_TOKEN}
      - BESZEL_URL=${BESZEL_URL}
      - BESZEL_API_TOKEN=${BESZEL_API_TOKEN}
      - CALENDAR_URL=${CALENDAR_URL}
      - KARAKEEP_API_KEY=${KARAKEEP_API_KEY}
      - TS_TAILNET=${TS_TAILNET}
      - LIL_HOMIE_HOST=${LIL_HOMIE_HOST}
      - LAT=${LAT}
      - LON=${LON}
      - WEATHER_LOCATION=${WEATHER_LOCATION}
      - SYNCTHING_URL=${SYNCTHING_URL}
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY}
      - SYNCTHING_FOLDER_1_ID=${SYNCTHING_FOLDER_1_ID}
    volumes:
      - ../../glance-config:/app/config
    depends_on:
      - socket-proxy
    ports:
      - 127.0.0.1:8088:8080
    networks:
      - caddy_network
      - socket_proxy

  glances-ical:
    container_name: glances-ical
    image: ghcr.io/awildleon/glance-ical-events:latest
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    networks:
      - caddy_network

  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${DATA_PATH}/syncthing:/var/syncthing
      # 8 TB storage drive (README, Storage drive). Bulk folders go in /storage/sync.
      # rslave: if the drive mounts after the container starts, the container still sees it.
      - /srv/storage:/storage:rslave
    networks:
      - caddy_network
    ports:
      # Sync port on the tailnet IP only. ip_nonlocal_bind lets Docker bind it before tailscaled is up.
      - ${TS_IP}:22000:22000/tcp
      - ${TS_IP}:22000:22000/udp
      - 127.0.0.1:8384:8384

  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    volumes:
      - ${DATA_PATH}/backrest/data:/data
      - ${DATA_PATH}/backrest/config:/config
      - ${DATA_PATH}/backrest/cache:/cache
      - ${DATA_PATH}:/userdata  # backup the data folder
      # 8 TB storage drive: the local restic repo is /storage/backup (README, Storage drive)
      - /srv/storage:/storage:rslave
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=America/New_York
    ports:
      - "127.0.0.1:9898:9898"
    restart: unless-stopped
    networks:
      - caddy_network

  restic-glance-extension:
    container_name: restic-glance-extension
    image: ghcr.io/not-first/restic-glance-extension
    ports:
      - '127.0.0.1:8675:8675'
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - RESTIC_REPOS=${RESTIC_REPOS}
      - RESTIC_CACHE_INTERVAL=${RESTIC_CACHE_INTERVAL}
      - BACKUPS_RESTIC_URL=${BACKUPS_RESTIC_URL}
      - BACKUPS_RESTIC_PASSWORD=${BACKUPS_RESTIC_PASSWORD}
      - BACKUPS_RESTIC_ENV__AWS_ACCESS_KEY_ID=${BACKUPS_RESTIC_ENV__AWS_ACCESS_KEY_ID}
      - BACKUPS_RESTIC_ENV__AWS_SECRET_ACCESS_KEY=${BACKUPS_RESTIC_ENV__AWS_SECRET_ACCESS_KEY}
    networks:
      - caddy_network

networks:
  caddy_network:
    name: caddy_network
    external: true
  socket_proxy:
    internal: true
