# Forgejo: the git host. Tailnet only, see README "Forgejo".
#   web: Tailscale Service forgejo (443) -> 127.0.0.1:3001 -> forgejo-proxy (sign-in header) -> forgejo:3000
#   ssh: Tailscale Service forgejo (TCP 22) -> 127.0.0.1:2222 -> forgejo:2222 (built-in SSH server)
#   CI:  forgejo_ci -> forgejo-ci (no sign-in header) -> forgejo:3000
#   Glance: forgejo_glance -> forgejo-ci -> forgejo:3000 (API token only)
# Not on caddy_network: no other container can reach Forgejo or send it a sign-in header.
services:
  forgejo:
    container_name: forgejo
    # Pinned to a major version: `manage.sh update` pulls patch releases only. 17 is supported
    # until 2027-01-28. Read the release notes before a major bump (database migrations).
    image: codeberg.org/forgejo/forgejo:17-rootless
    restart: unless-stopped
    volumes:
      # app.ini is at custom/conf/app.ini, repos at git/repositories, SQLite at data/gitea.db
      - ${DATA_PATH}/forgejo:/var/lib/gitea
    ports:
      - 127.0.0.1:2222:2222
    environment:
      FORGEJO__server__DOMAIN: forgejo.${TS_TAILNET}
      FORGEJO__server__ROOT_URL: https://forgejo.${TS_TAILNET}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__SSH_DOMAIN: forgejo.${TS_TAILNET}
      # The port in clone URLs. Forgejo listens on 2222; the Service forwards 22 to it.
      FORGEJO__server__SSH_PORT: "22"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
      # Sign-in from the Tailscale login, see Caddyfile. Forgejo trusts X-WEBAUTH-USER from any source
      # (tested: TRUSTED_PROXIES does not limit it), so only the network keeps other senders out.
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTO_REGISTRATION: "false"
      # Use X-Forwarded-For from the proxy only, for the real client IP in the logs
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: 172.30.0.10/32
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      # New repos are private. Make a repo public on purpose, before it gets a GitHub mirror.
      FORGEJO__repository__DEFAULT_PRIVATE: private
      # Push to a repo that does not exist yet under my user to create it. It is private, as above.
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__repository__DEFAULT_PUSH_CREATE_PRIVATE: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      # No wiki or projects on any repo. Issues, PRs, packages, and Actions stay.
      FORGEJO__repository__DISABLED_REPO_UNITS: repo.wiki,repo.projects
      # Squash: the PR title and description become the commit on main (crux and baseline use this)
      FORGEJO__repository_0X2E_pull_0X2D_request__DEFAULT_MERGE_STYLE: squash
      # CI runs on the forgejo-runner stack. `uses: actions/checkout@v7` and the like resolve to
      # GitHub, so the workflows name the same actions on Forgejo as on GitHub.
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://github.com
    networks:
      - forgejo

  # Forgejo for CI, without the sign-in header. See Caddyfile.ci.
  forgejo-ci:
    container_name: forgejo-ci
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile.ci:/etc/caddy/Caddyfile:ro
    networks:
      - forgejo
      - ci
      - glance

  forgejo-proxy:
    container_name: forgejo-proxy
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:3001:80
    environment:
      TS_LOGIN: ${TS_LOGIN}
      FORGEJO_USER: ${FORGEJO_USER}
    networks:
      forgejo:
        ipv4_address: 172.30.0.10

networks:
  forgejo:
    name: forgejo_network
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # CI jobs (forgejo-runner stack). Internal: no route out. A job reaches only forgejo-ci, the runner,
  # and the egress proxy.
  ci:
    name: forgejo_ci
    internal: true
    ipam:
      config:
        - subnet: 172.30.1.0/24
  # Glance reads the API through forgejo-ci with a token (glance-config/widget-config/forgejo.yml).
  # The homie stack makes this network. Internal, like ci.
  glance:
    name: forgejo_glance
    external: true
