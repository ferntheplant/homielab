# The egress proxy for CI jobs. Job containers are on forgejo_ci, an internal network with no route
# out, so this proxy is their only path to the internet. It refuses every private, tailnet, and
# link-local address. A job cannot reach micro-homie, the LAN, or another box on the tailnet, where
# its traffic would carry micro-homie's tailnet identity (the owner's).
#
# `dst` matches on the addresses that the host name resolves to, so a public name that resolves to
# a private address is refused too.

http_port 3128

acl ci_jobs src 172.30.1.0/24
acl blocked dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl blocked dst 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
# No ::ffff:0:0/96: Squid stores IPv4 addresses in that form, so it would block all of IPv4.
acl blocked dst ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8
acl web_ports port 80 443
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !ci_jobs
http_access deny !web_ports
http_access deny CONNECT !tls_port
http_access deny to_localhost
http_access deny to_linklocal
http_access deny blocked
http_access allow ci_jobs
http_access deny all

# A pass-through proxy: no cache, no headers that name the client
cache deny all
via off
forwarded_for delete
httpd_suppress_version_string on

pid_filename none
cache_log /dev/stderr
access_log stdio:/dev/stdout
logfile_rotate 0
coredump_dir /tmp
shutdown_lifetime 2 seconds
