services:
  karakeep-web:
    container_name: karakeep-web
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
      # By default, the data is stored in a docker volume called "data".
      # If you want to mount a custom directory, change the volume mapping to:
      # - /path/to/your/directory:/data
      - ${DATA_PATH}/karakeep:/data
    ports:
      - 127.0.0.1:3000:3000
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS}
      NEXTAUTH_URL: https://karakeep.${TS_TAILNET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CRAWLER_NUM_WORKERS: ${CRAWLER_NUM_WORKERS}
      # llama-server on lil-homie (Tailscale Serve), OpenAI-compatible /v1 API. Thinking is off on the
      # server (models.ini); reasoning_effort=none below keeps it off if that changes.
      OPENAI_BASE_URL: ${LLM_URL}/v1
      # Embeddings go through embed_proxy.py, which cuts input to the model's 512 tokens as Ollama did
      # (llama-server rejects longer input). The API key falls back to OPENAI_API_KEY.
      EMBEDDING_OPENAI_BASE_URL: ${LLM_EMBED_URL}/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT}
      INFERENCE_TEXT_MODEL: ${INFERENCE_TEXT_MODEL}
      INFERENCE_IMAGE_MODEL: ${INFERENCE_IMAGE_MODEL}
      EMBEDDING_TEXT_MODEL: ${EMBEDDING_TEXT_MODEL}
      # Off by default with a custom OPENAI_BASE_URL. Enables semantic + hybrid search.
      EMBEDDING_ENABLE_AUTO_INDEXING: ${EMBEDDING_ENABLE_AUTO_INDEXING}
      # Must match the embedding model: nomic-embed-text-v2-moe returns 768
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      INFERENCE_CONTEXT_LENGTH: ${INFERENCE_CONTEXT_LENGTH}
      INFERENCE_NUM_WORKERS: ${INFERENCE_NUM_WORKERS}
      INFERENCE_ENABLE_AUTO_SUMMARIZATION: ${INFERENCE_ENABLE_AUTO_SUMMARIZATION}
      INFERENCE_JOB_TIMEOUT_SEC: ${INFERENCE_JOB_TIMEOUT_SEC}

      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: /data # DON'T CHANGE THIS
    networks:
      - caddy_network

  karakeep-chrome:
    container_name: karakeep-chrome
    image: zenika/alpine-chrome:124 # gcr.io/zenika-hub no longer serves pulls
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    networks:
      - caddy_network

  karakeep-meilisearch:
    container_name: karakeep-meilisearch
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - ${DATA_PATH}/karakeep-meilisearch:/meili_data
    networks:
      - caddy_network

networks:
  caddy_network:
    name: caddy_network
    external: true
